# Isolated, disposable database. Used only by scripts/test-integration.sh.
services:
  db:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: knowledgehub_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d knowledgehub_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  tests:
    image: golang:1.26.5-bookworm
    working_dir: /src
    volumes:
      - .:/input:ro
    environment:
      TEST_DATABASE_URL: postgres://test:test@db:5432/knowledgehub_test?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-ec", "cp -a /input/. /src/ && go mod download && go vet ./... && go test -race -count=1 ./..."]

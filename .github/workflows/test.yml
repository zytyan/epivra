name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: knowledgehub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d knowledgehub_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://test:test@127.0.0.1:5432/knowledgehub_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      - run: go mod download
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go run ./cmd/openapi > /tmp/openapi.json && diff -u docs/openapi.json /tmp/openapi.json
      - run: docker build -t epivra:ci .
